- name: Amazon Connect Contact Lens API
  description: >-
    Amazon Connect Contact Lens enables you to analyze conversations between customers and agents using
    speech transcription, natural language processing, and intelligent search capabilities. It performs
    sentiment analysis, detects issues, and enables automatic categorization of contacts with both real-time
    and post-call analytics.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
