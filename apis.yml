description: Amazon Connect is a cloud-based contact center service that makes it
  easy to set up and manage a customer contact center and provide reliable customer
  engagement at any scale, with omnichannel support for voice, chat, email, and task
  management. It includes AI-powered features for agent assistance, customer profiles,
  conversation analytics, and outbound campaign management.
