- name: Amazon Connect Participant Service API
  description: >-
    The Amazon Connect Participant Service enables managing chat participants including agents, customers,
    and managers. Use it to send messages and events, manage connection state, share attachments, and
    retrieve chat transcripts within a chat contact.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  humanURL: >-
