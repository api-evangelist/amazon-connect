- name: Amazon Connect Cases API
  description: >-
    With Amazon Connect Cases, agents can track and manage customer issues that require multiple interactions,
    follow-up tasks, and teams in your contact center. A case represents a customer issue including the
    steps and interactions taken to resolve it.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
