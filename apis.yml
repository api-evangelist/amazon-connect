- type: Integrations
  data:
  - name: Salesforce CRM
    description: Pre-built AppFlow connector to sync Salesforce customer data into Amazon Connect Customer
      Profiles.
  - name: ServiceNow
    description: ITSM integration via AppFlow to bring ServiceNow customer and case data into the Amazon
      Connect agent workspace.
  - name: AWS Lambda
    description: Native integration with AWS Lambda for custom automation within contact flows and agent
      events.
  - name: Amazon Lex
    description: Built-in integration with Amazon Lex for building conversational AI bots for voice and
      chat self-service.
  - name: Amazon Bedrock
    description: Foundation for Amazon Q in Connect generative AI features, providing real-time agent
      recommendations and answers.
  - name: Amazon S3
    description: Storage integration for call recordings, contact transcripts, exported reports, and Contact
      Lens output data.
  - name: Amazon Kinesis
    description: Real-time streaming of contact trace records (CTRs) and agent events to data lakes and
      analytics pipelines.
  - name: WhatsApp Business
    description: Native channel integration to handle customer messaging through WhatsApp Business within
      the Amazon Connect platform.
