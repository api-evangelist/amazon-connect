- name: Amazon Q Connect API
  description: >-
    Amazon Q in Connect is a generative AI customer service assistant built on Amazon Bedrock. It provides
    real-time recommendations to help contact center agents resolve customer issues quickly and accurately
    by detecting customer intent and providing immediate generative responses, suggested actions, and
    links to relevant documents.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  humanURL: >-
    https://docs.aws.amazon.com/connect/latest/APIReference/API_Operations_Amazon_Q_Connect.html
