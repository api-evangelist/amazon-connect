- type: Features
  data:
  - name: Omnichannel Routing
    description: Unified routing across voice, chat, email, and tasks through a single
      platform with skills-based routing and priority queuing.
  - name: AI-Powered Agent Assist
    description: Amazon Q in Connect provides real-time AI-generated recommendations
      and answers to help agents resolve customer issues faster.
  - name: Contact Flows
    description: Drag-and-drop contact flow designer for building IVR, chatbot, and
      agent guidance workflows without extensive coding.
  - name: Conversational Analytics
    description: Contact Lens provides speech transcription, sentiment analysis, and
      NLP-powered insights across all customer interactions.
  - name: Customer Profiles
    description: Unified customer profile combining CRM, ITSM, ERP, and contact history
      data for context-aware agent interactions.
  - name: Outbound Campaigns
    description: High-volume multi-channel outbound campaigns with predictive dialer,
      answering machine detection, and multiple dialing modes.
  - name: Cases Management
    description: Structured case tracking for customer issues requiring multiple interactions,
      follow-up tasks, and cross-team coordination.
  - name: Voice and Video Calling
    description: In-app, web, and video calling with screen share capabilities using
      16kHz high-quality audio with packet loss resistance.
  - name: Chat and Messaging
    description: Real-time and asynchronous messaging including SMS, WhatsApp Business,
      and Apple Messages for Business integration.
  - name: Real-Time and Historical Metrics
    description: Comprehensive dashboards and reporting for contact center performance
      optimization and workforce planning.
- type: UseCases
  data:
  - name: Customer Support Contact Center
    description: Deploy an omnichannel contact center handling voice, chat, email,
      and messaging with intelligent routing to the right agents.
  - name: AI-Powered Self-Service
    description: Build conversational AI flows that handle common customer requests
      in 30+ languages without agent involvement.
  - name: Agent Productivity Improvement
    description: Reduce average handle time with real-time AI guidance, unified agent
      workspace, and automated post-contact work.
  - name: Outbound Customer Engagement
    description: Run appointment reminders, subscription renewals, payment notifications,
      and telemarketing campaigns at scale.
  - name: Fraud Prevention
    description: Use Voice ID for real-time caller authentication and fraud risk detection
      in voice contact center interactions.
  - name: Compliance and Quality Monitoring
    description: Analyze 100% of customer interactions with Contact Lens for regulatory
      compliance and quality assurance.
- type: SpectralRules
  url: rules/amazon-connect-spectral-rules.yml
- type: Vocabulary
  url: vocabulary/amazon-connect-vocabulary.yaml
- type: Integrations
  data:
  - name: Salesforce CRM
    description: Pre-built AppFlow connector to sync Salesforce customer data into
      Amazon Connect Customer Profiles.
  - name: ServiceNow
    description: ITSM integration via AppFlow to bring ServiceNow customer and case
      data into the Amazon Connect agent workspace.
  - name: AWS Lambda
    description: Native integration with AWS Lambda for custom automation within contact
      flows and agent events.
  - name: Amazon Lex
    description: Built-in integration with Amazon Lex for building conversational
      AI bots for voice and chat self-service.
  - name: Amazon Bedrock
    description: Foundation for Amazon Q in Connect generative AI features, providing
      real-time agent recommendations and answers.
  - name: Amazon S3
    description: Storage integration for call recordings, contact transcripts, exported
      reports, and Contact Lens output data.
  - name: Amazon Kinesis
    description: Real-time streaming of contact trace records (CTRs) and agent events
      to data lakes and analytics pipelines.
  - name: WhatsApp Business
    description: Native channel integration to handle customer messaging through WhatsApp
      Business within the Amazon Connect platform.
