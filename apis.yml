- name: Amazon Connect Customer Profiles API
  description: >-
    Amazon Connect Customer Profiles provides a unified customer profile for your contact center with
    pre-built connectors powered by AppFlow that make it easy to combine customer information from third-party
    applications such as Salesforce (CRM), ServiceNow (ITSM), and ERP systems with contact history from
    Amazon Connect.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  humanURL: >-
    https://docs.aws.amazon.com/connect/latest/APIReference/API_Operations_Amazon_Connect_Customer_Profiles.html
