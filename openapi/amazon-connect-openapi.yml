  /federation-token/{InstanceId}:
    get:
      operationId: getFederationToken
      summary: Amazon Connect Get Federation Token
      description: >-
        Retrieves a token for federation. This API doesn't support root users.
        If you try to invoke GetFederationToken with root credentials, an error
        message similar to the following one appears.
      parameters:
        - name: InstanceId
          in: path
          required: true
          description: The identifier of the Amazon Connect instance.
          schema:
            type: string
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  Credentials:
                    type: object
                    description: The credentials to use for federation.
                    properties:
                      AccessToken:
                        type: string
                        description: The access token.
                      AccessTokenExpiration:
                        type: string
                        format: date-time
                        description: The timestamp when access token expires.
                      RefreshToken:
                        type: string
                        description: The refresh token.
                      RefreshTokenExpiration:
                        type: string
                        format: date-time
                        description: The timestamp when refresh token expires.
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Authentication
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_signature:
      type: http
      scheme: bearer
      description: >-
        AWS Signature Version 4 authentication. Requests must be signed using
        IAM credentials with appropriate Amazon Connect permissions.
  schemas:
    Error:
      type: object
      description: An Amazon Connect error response.
      properties:
        message:
          type: string
          description: The error message.
          example: The specified resource was not found.
        code:
          type: string
          description: The error code.
          example: ResourceNotFoundException
    Instance:
      type: object
      description: The Amazon Connect instance.
      properties:
        Id:
          type: string
          description: The identifier of the Amazon Connect instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the instance.
          example: arn:aws:connect:us-east-1:123456789012:instance/a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        IdentityManagementType:
          type: string
          description: The identity management type.
          enum:
            - SAML
            - CONNECT_MANAGED
            - EXISTING_DIRECTORY
          example: CONNECT_MANAGED
        InstanceAlias:
          type: string
          description: The alias of the instance.
          example: my-contact-center
        CreatedTime:
          type: string
          format: date-time
          description: When the instance was created.
          example: "2025-01-15T10:30:00Z"
        ServiceRole:
          type: string
          description: The service role of the instance.
        InstanceStatus:
          type: string
          description: The state of the instance.
          enum:
            - CREATION_IN_PROGRESS
            - ACTIVE
            - CREATION_FAILED
          example: ACTIVE
        InboundCallsEnabled:
          type: boolean
          description: Whether inbound calls are enabled.
          example: true
        OutboundCallsEnabled:
          type: boolean
          description: Whether outbound calls are enabled.
          example: true
    InstanceSummary:
      type: object
      description: Information about the Amazon Connect instance.
      properties:
        Id:
          type: string
          description: The identifier of the instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        Arn:
          type: string
          description: The ARN of the instance.
          example: arn:aws:connect:us-east-1:123456789012:instance/a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        IdentityManagementType:
          type: string
          description: The identity management type.
          example: CONNECT_MANAGED
        InstanceAlias:
          type: string
          description: The alias of the instance.
          example: my-contact-center
        InstanceStatus:
          type: string
          description: The state of the instance.
          example: ACTIVE
        InboundCallsEnabled:
          type: boolean
          example: true
        OutboundCallsEnabled:
          type: boolean
          example: true
    ListInstancesResponse:
      type: object
      properties:
        InstanceSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSummary"
        NextToken:
          type: string
          description: If there are additional results, this is the token for the next set.
    CreateInstanceRequest:
      type: object
      required:
        - IdentityManagementType
        - InboundCallsEnabled
        - OutboundCallsEnabled
      properties:
        ClientToken:
          type: string
          description: The idempotency token.
        IdentityManagementType:
          type: string
          description: The type of identity management for your Amazon Connect users.
          enum:
            - SAML
            - CONNECT_MANAGED
            - EXISTING_DIRECTORY
          example: CONNECT_MANAGED
        InstanceAlias:
          type: string
          description: The name for your instance.
          example: my-contact-center
        DirectoryId:
          type: string
          description: The identifier for the directory.
        InboundCallsEnabled:
          type: boolean
          description: Your contact center handles incoming contacts.
          example: true
        OutboundCallsEnabled:
          type: boolean
          description: Your contact center allows outbound calls.
          example: true
        Tags:
          type: object
          description: The tags used to organize, track, or control access for this resource.
          additionalProperties:
            type: string
    CreateInstanceResponse:
      type: object
      properties:
        Id:
          type: string
          description: The identifier for the instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the instance.
          example: arn:aws:connect:us-east-1:123456789012:instance/a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
    DescribeInstanceResponse:
      type: object
      properties:
        Instance:
          $ref: "#/components/schemas/Instance"
    User:
      type: object
      description: Contains information about a user account for an Amazon Connect instance.
      properties:
        Id:
          type: string
          description: The identifier of the user account.
          example: "500123"
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the user account.
          example: arn:aws:connect:us-east-1:123456789012:instance/a1b2c3d4/agent/500123
        Username:
          type: string
          description: The user name assigned to the user account.
          example: jsmith
        IdentityInfo:
          $ref: "#/components/schemas/UserIdentityInfo"
        PhoneConfig:
          $ref: "#/components/schemas/UserPhoneConfig"
        DirectoryUserId:
          type: string
          description: The identifier of the user account in the directory service that Amazon
            Connect uses to authenticate users.
        SecurityProfileIds:
          type: array
          items:
            type: string
          description: The identifiers of the security profiles for the user.
        RoutingProfileId:
          type: string
          description: The identifier of the routing profile for the user.
          example: a1b2c3d4-5678-90ab-cdef-33333EXAMPLE
        HierarchyGroupId:
          type: string
          description: The identifier of the hierarchy group for the user.
        Tags:
          type: object
          description: The tags.
          additionalProperties:
            type: string
    UserIdentityInfo:
      type: object
      description: Contains information about the identity of a user.
      properties:
        FirstName:
          type: string
          description: The first name.
          example: Jane
        LastName:
          type: string
          description: The last name.
          example: Smith
        Email:
          type: string
          format: email
          description: The email address.
          example: jsmith@example.com
        SecondaryEmail:
          type: string
          format: email
          description: The secondary email address.
        Mobile:
          type: string
          description: The user's mobile number.
    UserPhoneConfig:
      type: object
      description: Contains information about the phone configuration settings for a user.
      required:
        - PhoneType
      properties:
        PhoneType:
          type: string
          description: The phone type.
          enum:
            - SOFT_PHONE
            - DESK_PHONE
          example: SOFT_PHONE
        AutoAccept:
          type: boolean
          description: The Auto accept setting.
          example: false
        AfterContactWorkTimeLimit:
          type: integer
          description: The After Contact Work (ACW) timeout setting, in seconds.
          example: 0
        DeskPhoneNumber:
          type: string
          description: The phone number for the user's desk phone.
    UserSummary:
      type: object
      description: Contains summary information about a user.
      properties:
        Id:
          type: string
          description: The identifier of the user account.
          example: "500123"
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the user account.
          example: arn:aws:connect:us-east-1:123456789012:instance/a1b2c3d4/agent/500123
        Username:
          type: string
          description: The Amazon Connect user name of the user account.
          example: jsmith
    ListUsersResponse:
      type: object
      properties:
        UserSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        NextToken:
          type: string
    CreateUserRequest:
      type: object
      required:
        - PhoneConfig
        - RoutingProfileId
        - SecurityProfileIds
        - Username
      properties:
        Username:
          type: string
          description: The user name for the account.
          example: jsmith
        Password:
          type: string
          description: The password for the user account.
        IdentityInfo:
          $ref: "#/components/schemas/UserIdentityInfo"
        PhoneConfig:
          $ref: "#/components/schemas/UserPhoneConfig"
        DirectoryUserId:
          type: string
        SecurityProfileIds:
          type: array
          items:
            type: string
          description: The identifier of the security profile for the user.
        RoutingProfileId:
          type: string
          description: The identifier of the routing profile for the user.
          example: a1b2c3d4-5678-90ab-cdef-33333EXAMPLE
        HierarchyGroupId:
          type: string
        Tags:
          type: object
          additionalProperties:
            type: string
    CreateUserResponse:
      type: object
      properties:
        UserId:
          type: string
          description: The identifier of the user account.
          example: "500123"
        UserArn:
          type: string
          description: The Amazon Resource Name (ARN) of the user account.
    DescribeUserResponse:
      type: object
      properties:
        User:
          $ref: "#/components/schemas/User"
    UpdateUserIdentityInfoRequest:
      type: object
      required:
        - IdentityInfo
      properties:
        IdentityInfo:
          $ref: "#/components/schemas/UserIdentityInfo"
    RoutingProfileSummary:
      type: object
      description: Contains summary information about a routing profile.
      properties:
        Id:
          type: string
          description: The identifier of the routing profile.
          example: a1b2c3d4-5678-90ab-cdef-33333EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the routing profile.
        Name:
          type: string
          description: The name of the routing profile.
          example: Basic Routing Profile
    ListRoutingProfilesResponse:
      type: object
      properties:
        RoutingProfileSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/RoutingProfileSummary"
        NextToken:
          type: string
    RoutingProfile:
      type: object
      description: Contains information about a routing profile.
      properties:
        InstanceId:
          type: string
          description: The identifier of the Amazon Connect instance.
        Name:
          type: string
          description: The name of the routing profile.
          example: Voice Agents
        RoutingProfileArn:
          type: string
          description: The Amazon Resource Name (ARN) of the routing profile.
        RoutingProfileId:
          type: string
          description: The identifier of the routing profile.
          example: a1b2c3d4-5678-90ab-cdef-33333EXAMPLE
        Description:
          type: string
          description: The description of the routing profile.
        MediaConcurrencies:
          type: array
          items:
            $ref: "#/components/schemas/MediaConcurrency"
        DefaultOutboundQueueId:
          type: string
          description: The identifier of the default outbound queue for this routing profile.
        Tags:
          type: object
          additionalProperties:
            type: string
        NumberOfAssociatedQueues:
          type: integer
          description: The number of associated queues in routing profile.
        NumberOfAssociatedUsers:
          type: integer
          description: The number of associated users in routing profile.
    MediaConcurrency:
      type: object
      description: Contains information about which channels are supported, and how many contacts
        an agent can have on a channel simultaneously.
      required:
        - Channel
        - Concurrency
      properties:
        Channel:
          type: string
          description: The channels that agents can handle in the Contact Control Panel (CCP).
          enum:
            - VOICE
            - CHAT
            - TASK
            - EMAIL
          example: VOICE
        Concurrency:
          type: integer
          description: The number of contacts an agent can have on a channel simultaneously.
          minimum: 1
          maximum: 10
          example: 1
    CreateRoutingProfileRequest:
      type: object
      required:
        - DefaultOutboundQueueId
        - Description
        - MediaConcurrencies
        - Name
      properties:
        Name:
          type: string
          description: The name of the routing profile. Must not be more than 127 characters.
          example: Voice Agents
        Description:
          type: string
          description: Description of the routing profile.
          example: Routing profile for voice agents
        DefaultOutboundQueueId:
          type: string
          description: The default outbound queue for the routing profile.
          example: a1b2c3d4-5678-90ab-cdef-55555EXAMPLE
        QueueConfigs:
          type: array
          items:
            type: object
            properties:
              QueueReference:
                type: object
                properties:
                  QueueId:
                    type: string
                  Channel:
                    type: string
              Priority:
                type: integer
              Delay:
                type: integer
        MediaConcurrencies:
          type: array
          items:
            $ref: "#/components/schemas/MediaConcurrency"
        Tags:
          type: object
          additionalProperties:
            type: string
    CreateRoutingProfileResponse:
      type: object
      properties:
        RoutingProfileArn:
          type: string
          description: The Amazon Resource Name (ARN) of the routing profile.
        RoutingProfileId:
          type: string
          description: The identifier of the routing profile.
          example: a1b2c3d4-5678-90ab-cdef-33333EXAMPLE
    DescribeRoutingProfileResponse:
      type: object
      properties:
        RoutingProfile:
          $ref: "#/components/schemas/RoutingProfile"
    QueueSummary:
      type: object
      description: Contains summary information about a queue.
      properties:
        Id:
          type: string
          description: The identifier of the queue.
          example: a1b2c3d4-5678-90ab-cdef-55555EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the queue.
        Name:
          type: string
          description: The name of the queue.
          example: BasicQueue
        QueueType:
          type: string
          description: The type of queue.
          enum:
            - STANDARD
            - AGENT
          example: STANDARD
    Queue:
      type: object
      description: Contains information about a queue.
      properties:
        Name:
          type: string
          description: The name of the queue.
          example: BasicQueue
        QueueArn:
          type: string
          description: The Amazon Resource Name (ARN) for the queue.
        QueueId:
          type: string
          description: The identifier for the queue.
          example: a1b2c3d4-5678-90ab-cdef-55555EXAMPLE
        Description:
          type: string
          description: The description of the queue.
        OutboundCallerConfig:
          type: object
          properties:
            OutboundCallerIdName:
              type: string
            OutboundCallerIdNumberId:
              type: string
            OutboundFlowId:
              type: string
        HoursOfOperationId:
          type: string
          description: The identifier for the hours of operation.
        MaxContacts:
