          $ref: "#/components/schemas/ContactFlow"
    HoursOfOperationSummary:
      type: object
      description: Contains summary information about hours of operation for a contact center.
      properties:
        Id:
          type: string
          description: The identifier of the hours of operation.
          example: a1b2c3d4-5678-90ab-cdef-66666EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the hours of operation.
        Name:
          type: string
          description: The name of the hours of operation.
          example: Business Hours
    ListHoursOfOperationsResponse:
      type: object
      properties:
        HoursOfOperationSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/HoursOfOperationSummary"
        NextToken:
          type: string
    HoursOfOperationTimeSlice:
      type: object
      description: The start or end time of an hours of operation.
      required:
        - Hours
        - Minutes
      properties:
        Hours:
          type: integer
          description: The hours.
          minimum: 0
          maximum: 23
          example: 9
        Minutes:
          type: integer
          description: The minutes.
          minimum: 0
          maximum: 59
          example: 0
    HoursOfOperationConfig:
      type: object
      description: Contains information about the hours of operation.
      required:
        - Day
        - StartTime
        - EndTime
      properties:
        Day:
          type: string
          description: The day that the hours of operation applies to.
          enum:
            - SUNDAY
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
          example: MONDAY
        StartTime:
          $ref: "#/components/schemas/HoursOfOperationTimeSlice"
        EndTime:
          $ref: "#/components/schemas/HoursOfOperationTimeSlice"
    CreateHoursOfOperationRequest:
      type: object
      required:
        - Config
        - Name
        - TimeZone
      properties:
        Name:
          type: string
          description: The name of the hours of operation.
          example: Business Hours
        Description:
          type: string
          description: The description of the hours of operation.
        TimeZone:
          type: string
          description: The time zone of the hours of operation.
          example: America/New_York
        Config:
          type: array
          items:
            $ref: "#/components/schemas/HoursOfOperationConfig"
        Tags:
          type: object
          additionalProperties:
            type: string
    CreateHoursOfOperationResponse:
      type: object
      properties:
        HoursOfOperationId:
          type: string
          description: The identifier for the hours of operation.
          example: a1b2c3d4-5678-90ab-cdef-66666EXAMPLE
        HoursOfOperationArn:
          type: string
          description: The Amazon Resource Name (ARN) for the hours of operation.
    AgentStatusSummary:
      type: object
      description: Contains information about an agent status.
      properties:
        Id:
          type: string
          description: The identifier for an agent status.
          example: a1b2c3d4-5678-90ab-cdef-44444EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) for the agent status.
        Name:
          type: string
          description: The name of the agent status.
          example: Available
        Type:
          type: string
          description: The type of the agent status.
          enum:
            - ROUTABLE
            - CUSTOM
            - OFFLINE
          example: ROUTABLE
    ListAgentStatusesResponse:
      type: object
      properties:
        AgentStatusSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/AgentStatusSummary"
        NextToken:
          type: string
    SecurityProfileSummary:
      type: object
      description: Contains information about a security profile.
      properties:
        Id:
          type: string
          description: The identifier of the security profile.
          example: a1b2c3d4-5678-90ab-cdef-22222EXAMPLE
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) of the security profile.
        Name:
          type: string
          description: The name of the security profile.
          example: Agent
    ListSecurityProfilesResponse:
      type: object
      properties:
        SecurityProfileSummaryList:
          type: array
          items:
            $ref: "#/components/schemas/SecurityProfileSummary"
        NextToken:
          type: string
    StartChatContactRequest:
      type: object
      required:
        - ContactFlowId
        - InstanceId
        - ParticipantDetails
      properties:
        InstanceId:
          type: string
          description: The identifier of the Amazon Connect instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        ContactFlowId:
          type: string
          description: The identifier of the contact flow for initiating the chat.
          example: a1b2c3d4-5678-90ab-cdef-77777EXAMPLE
        Attributes:
          type: object
          description: A custom key-value pair using an attribute map.
          additionalProperties:
            type: string
        ParticipantDetails:
          type: object
          required:
            - DisplayName
          properties:
            DisplayName:
              type: string
              description: Display name of the participant.
              example: Jane Smith
        InitialMessage:
          type: object
          properties:
            ContentType:
              type: string
              example: text/plain
            Content:
              type: string
              example: Hello, I need help with my order.
        ClientToken:
          type: string
          description: Idempotency token.
        ChatDurationInMinutes:
          type: integer
          description: The total duration of the newly started chat session.
          example: 60
    StartChatContactResponse:
      type: object
      properties:
        ContactId:
          type: string
          description: The identifier of the contact.
          example: a1b2c3d4-5678-90ab-cdef-88888EXAMPLE
        ParticipantId:
          type: string
          description: The identifier for a chat participant.
          example: a1b2c3d4-5678-90ab-cdef-99999EXAMPLE
        ParticipantToken:
          type: string
          description: The token used by the chat participant to call CreateParticipantConnection.
    StartOutboundVoiceContactRequest:
      type: object
      required:
        - ContactFlowId
        - DestinationPhoneNumber
        - InstanceId
      properties:
        DestinationPhoneNumber:
          type: string
          description: The phone number of the customer, in E.164 format.
          example: "+12065551212"
        ContactFlowId:
          type: string
          description: The identifier of the contact flow for the outbound call.
          example: a1b2c3d4-5678-90ab-cdef-77777EXAMPLE
        InstanceId:
          type: string
          description: The identifier of the Amazon Connect instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        ClientToken:
          type: string
          description: Idempotency token.
        SourcePhoneNumber:
          type: string
          description: The phone number associated with the Amazon Connect instance, in E.164 format.
        QueueId:
          type: string
          description: The queue for the call.
          example: a1b2c3d4-5678-90ab-cdef-55555EXAMPLE
        Attributes:
          type: object
          additionalProperties:
            type: string
    StartTaskContactRequest:
      type: object
      required:
        - InstanceId
        - Name
      properties:
        InstanceId:
          type: string
          description: The identifier of the Amazon Connect instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        PreviousContactId:
          type: string
          description: The identifier of the previous chat, voice, or task contact.
        ContactFlowId:
          type: string
          description: The identifier of the contact flow for initiating the tasks.
          example: a1b2c3d4-5678-90ab-cdef-77777EXAMPLE
        Attributes:
          type: object
          additionalProperties:
            type: string
        Name:
          type: string
          description: The name of a task that is shown to an agent in the Contact Control Panel (CCP).
          example: Follow-up with customer
        References:
          type: object
          additionalProperties:
            type: object
        Description:
          type: string
          description: A description of the task that is shown to an agent in the Contact Control Panel.
          example: Call customer back regarding their support case
        ClientToken:
          type: string
        ScheduledTime:
          type: string
          format: date-time
        TaskTemplateId:
          type: string
        QuickConnectId:
          type: string
        RelatedContactId:
          type: string
    Contact:
      type: object
      description: Contains information about a contact.
      properties:
        Arn:
          type: string
          description: The Amazon Resource Name (ARN) for the contact.
        Id:
          type: string
          description: The identifier for the contact.
          example: a1b2c3d4-5678-90ab-cdef-88888EXAMPLE
        InitialContactId:
          type: string
          description: If this contact is related to other contacts, this is the ID of the initial contact.
        PreviousContactId:
          type: string
          description: If this contact is not the first contact, this is the ID of the previous contact.
        Channel:
          type: string
          description: How the contact reached your contact center.
          enum:
            - VOICE
            - CHAT
            - TASK
            - EMAIL
          example: VOICE
        QueueInfo:
          type: object
          properties:
            Id:
              type: string
            EnqueueTimestamp:
              type: string
              format: date-time
        AgentInfo:
          type: object
          properties:
            Id:
              type: string
            ConnectedToAgentTimestamp:
              type: string
              format: date-time
        InitiationMethod:
          type: string
          description: Indicates how the contact was initiated.
          enum:
            - INBOUND
            - OUTBOUND
            - TRANSFER
            - QUEUE_TRANSFER
            - CALLBACK
            - API
          example: INBOUND
        InitiationTimestamp:
          type: string
          format: date-time
          description: The date and time this contact was initiated.
        DisconnectTimestamp:
          type: string
          format: date-time
          description: The timestamp when the customer endpoint disconnected from Amazon Connect.
        LastUpdateTimestamp:
          type: string
          format: date-time
          description: The timestamp when contact was last updated.
    DescribeContactResponse:
      type: object
      properties:
        Contact:
          $ref: "#/components/schemas/Contact"
    ContactSummary:
      type: object
      description: Contains summary information about a contact.
      properties:
        Id:
          type: string
          description: The identifier of the contact.
          example: a1b2c3d4-5678-90ab-cdef-88888EXAMPLE
        Arn:
          type: string
          description: The ARN of the contact.
        Channel:
          type: string
          description: How the contact reached your contact center.
          enum:
            - VOICE
            - CHAT
            - TASK
            - EMAIL
          example: VOICE
        InitiationMethod:
          type: string
          description: Indicates how the contact was initiated.
          example: INBOUND
        InitiationTimestamp:
          type: string
          format: date-time
        DisconnectTimestamp:
          type: string
          format: date-time
    SearchContactsRequest:
      type: object
      required:
        - InstanceId
        - TimeRange
      properties:
        InstanceId:
          type: string
          description: The identifier of the Amazon Connect instance.
          example: a1b2c3d4-5678-90ab-cdef-11111EXAMPLE
        TimeRange:
          type: object
          required:
            - EndTime
            - StartTime
            - Type
          properties:
            Type:
              type: string
              enum:
                - INITIATION_TIMESTAMP
                - SCHEDULED_TIMESTAMP
                - CONNECTED_TO_AGENT_TIMESTAMP
                - DISCONNECT_TIMESTAMP
              example: INITIATION_TIMESTAMP
            StartTime:
              type: string
              format: date-time
              example: "2025-03-15T00:00:00Z"
            EndTime:
              type: string
              format: date-time
              example: "2025-03-15T23:59:59Z"
        SearchCriteria:
          type: object
          properties:
            AgentIds:
              type: array
              items:
                type: string
            QueueIds:
              type: array
              items:
                type: string
            Channels:
              type: array
              items:
                type: string
        MaxResults:
          type: integer
          description: The maximum number of results to return.
          example: 50
        NextToken:
          type: string
        Sort:
          type: object
          properties:
            FieldName:
              type: string
            Order:
              type: string
              enum:
                - ASCENDING
                - DESCENDING
    SearchContactsResponse:
      type: object
      properties:
        Contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactSummary"
        NextToken:
          type: string
        TotalCount:
          type: integer
          description: The total count of the search result.
    GetMetricDataRequest:
      type: object
      required:
        - EndTime
        - Filters
        - HistoricalMetrics
        - StartTime
      properties:
        StartTime:
          type: string
          format: date-time
          description: The timestamp, in UNIX Epoch time format, at which to start the reporting interval.
          example: "2025-03-15T00:00:00Z"
        EndTime:
          type: string
          format: date-time
          description: The timestamp, in UNIX Epoch time format, at which to end the reporting interval.
          example: "2025-03-15T23:59:59Z"
        Filters:
          type: object
          description: The queues, up to 100, or channels, to use to filter the metrics returned.
          properties:
            Queues:
              type: array
              items:
                type: string
            Channels:
              type: array
              items:
                type: string
                enum:
                  - VOICE
                  - CHAT
                  - TASK
        Groupings:
          type: array
          items:
            type: string
            enum:
              - QUEUE
              - CHANNEL
              - ROUTING_PROFILE
              - ROUTING_STEP_EXPRESSION
        HistoricalMetrics:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
                description: The name of the metric.
                enum:
                  - CONTACTS_QUEUED
                  - CONTACTS_HANDLED
                  - CONTACTS_ABANDONED
                  - CONTACTS_CONSULTED
                  - CONTACTS_AGENT_HUNG_UP_FIRST
                  - CONTACTS_HANDLED_INCOMING
                  - CONTACTS_HANDLED_OUTBOUND
                  - CONTACTS_HOLD_ABANDONS
                  - CONTACTS_TRANSFERRED_IN
                  - CONTACTS_TRANSFERRED_OUT
                  - CONTACTS_TRANSFERRED_IN_FROM_QUEUE
                  - CONTACTS_TRANSFERRED_OUT_FROM_QUEUE
                  - CONTACTS_MISSED
                  - CALLBACK_CONTACTS_HANDLED
                  - HANDLE_TIME
                  - AFTER_CONTACT_WORK_TIME
                  - QUEUED_TIME
                  - ABANDON_TIME
                  - QUEUE_ANSWER_TIME
                  - HOLD_TIME
                  - INTERACTION_TIME
                  - INTERACTION_AND_HOLD_TIME
                  - SERVICE_LEVEL
              Unit:
                type: string
                enum:
                  - SECONDS
                  - COUNT
                  - PERCENT
              Statistic:
                type: string
                enum:
                  - SUM
                  - MAX
                  - AVG
        NextToken:
          type: string
        MaxResults:
          type: integer
    GetMetricDataResponse:
      type: object
      properties:
        NextToken:
          type: string
        MetricResults:
          type: array
          items:
            type: object
            properties:
              Dimensions:
                type: object
                properties:
                  Queue:
                    type: object
                    properties:
                      Id:
                        type: string
                      Arn:
                        type: string
                  Channel:
                    type: string
              Collections:
                type: array
                items:
                  type: object
                  properties:
                    Metric:
                      type: object
                      properties:
                        Name:
                          type: string
                        Unit:
                          type: string
                        Statistic:
                          type: string
                    Value:
                      type: number
    GetCurrentMetricDataRequest:
      type: object
      required:
        - CurrentMetrics
        - Filters
      properties:
        Filters:
          type: object
          description: The queues, up to 100, or channels, to use to filter the metrics returned.
          properties:
            Queues:
              type: array
              items:
                type: string
            Channels:
              type: array
              items:
                type: string
                enum:
                  - VOICE
                  - CHAT
                  - TASK
        Groupings:
          type: array
          items:
            type: string
        CurrentMetrics:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
                enum:
                  - AGENTS_ONLINE
                  - AGENTS_AVAILABLE
                  - AGENTS_ON_CALL
                  - AGENTS_NON_PRODUCTIVE
                  - AGENTS_AFTER_CONTACT_WORK
                  - AGENTS_ERROR
                  - AGENTS_STAFFED
                  - CONTACTS_IN_QUEUE
                  - OLDEST_CONTACT_AGE
                  - CONTACTS_SCHEDULED
                  - AGENTS_ON_CONTACT
                  - SLOTS_ACTIVE
                  - SLOTS_AVAILABLE
              Unit:
                type: string
                enum:
                  - SECONDS
                  - COUNT
                  - PERCENT
        NextToken:
          type: string
        MaxResults:
          type: integer
    GetCurrentMetricDataResponse:
      type: object
      properties:
        NextToken:
          type: string
        MetricResults:
          type: array
          items:
            type: object
            properties:
              Dimensions:
                type: object
              Collections:
                type: array
                items:
                  type: object
                  properties:
                    Metric:
                      type: object
                    Value:
                      type: number
        DataSnapshotTime:
          type: string
          format: date-time
