description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: amazon-connect-free
    name: Free
    type: freemium
    description: Free entry tier for the Amazon Connect API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://connect.amazonaws.com
          - https://github.com/amazon-connect/amazon-connect-streams
          - https://app-integrations.amazonaws.com
          - https://contact-lens.amazonaws.com
          - https://connect-campaigns.amazonaws.com
          - https://cases.amazonaws.com
          - https://participant.connect.amazonaws.com
          - https://profile.profile.amazonaws.com
          - https://wisdom.amazonaws.com
          - https://voiceid.amazonaws.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://connect.amazonaws.com
          - https://github.com/amazon-connect/amazon-connect-streams
          - https://app-integrations.amazonaws.com
          - https://contact-lens.amazonaws.com
