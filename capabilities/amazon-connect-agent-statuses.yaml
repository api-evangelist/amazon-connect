naftiko: 1.0.0-alpha2
info:
  label: Amazon Connect Service API — Agent Statuses
  description: 'Amazon Connect Service API — Agent Statuses. 1 operations. Lead operation: Amazon Connect List Agent Statuses.
    Self-contained Naftiko capability covering one Amazon Connect business surface.'
  tags:
  - Amazon Connect
  - Agent Statuses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_CONNECT_API_KEY: AMAZON_CONNECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-connect-agent-statuses
    baseUri: https://connect.amazonaws.com
    description: Amazon Connect Service API — Agent Statuses business capability. Self-contained, no shared references.
    resources:
    - name: agent-status-InstanceId
      path: /agent-status/{InstanceId}
      operations:
      - name: listagentstatuses
        method: GET
        description: Amazon Connect List Agent Statuses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
        - name: nextToken
          in: query
          type: string
        - name: maxResults
          in: query
          type: integer
        - name: agentStatusTypes
          in: query
          type: array
    authentication:
      type: bearer
      token: '{{env.AMAZON_CONNECT_API_KEY}}'
  exposes:
  - type: rest
    namespace: amazon-connect-agent-statuses-rest
    port: 8080
    description: REST adapter for Amazon Connect Service API — Agent Statuses. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/agent-status/{instanceid}
      name: agent-status-instanceid
      description: REST surface for agent-status-InstanceId.
      operations:
      - method: GET
        name: listagentstatuses
        description: Amazon Connect List Agent Statuses
        call: amazon-connect-agent-statuses.listagentstatuses
        with:
          InstanceId: rest.InstanceId
          nextToken: rest.nextToken
          maxResults: rest.maxResults
          agentStatusTypes: rest.agentStatusTypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-connect-agent-statuses-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Connect Service API — Agent Statuses. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amazon-connect-list-agent-statuses
      description: Amazon Connect List Agent Statuses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-connect-agent-statuses.listagentstatuses
      with:
        InstanceId: tools.InstanceId
        nextToken: tools.nextToken
        maxResults: tools.maxResults
        agentStatusTypes: tools.agentStatusTypes
      outputParameters:
      - type: object
        mapping: $.
