naftiko: 1.0.0-alpha2
info:
  label: Amazon Connect Service API — Queues
  description: 'Amazon Connect Service API — Queues. 4 operations. Lead operation: Amazon Connect List Queues. Self-contained
    Naftiko capability covering one Amazon Connect business surface.'
  tags:
  - Amazon Connect
  - Queues
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_CONNECT_API_KEY: AMAZON_CONNECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-connect-queues
    baseUri: https://connect.amazonaws.com
    description: Amazon Connect Service API — Queues business capability. Self-contained, no shared references.
    resources:
    - name: queues-InstanceId
      path: /queues/{InstanceId}
      operations:
      - name: listqueues
        method: GET
        description: Amazon Connect List Queues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
        - name: queueTypes
          in: query
          type: array
          description: The type of queue.
        - name: nextToken
          in: query
          type: string
        - name: maxResults
          in: query
          type: integer
      - name: createqueue
        method: POST
        description: Amazon Connect Create Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: queues-InstanceId-QueueId
      path: /queues/{InstanceId}/{QueueId}
      operations:
      - name: describequeue
        method: GET
        description: Amazon Connect Describe Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
        - name: QueueId
          in: path
          type: string
          description: The identifier for the queue.
          required: true
      - name: deletequeue
        method: DELETE
        description: Amazon Connect Delete Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
        - name: QueueId
          in: path
          type: string
          description: The identifier for the queue.
          required: true
    authentication:
      type: bearer
      token: '{{env.AMAZON_CONNECT_API_KEY}}'
  exposes:
  - type: rest
    namespace: amazon-connect-queues-rest
    port: 8080
    description: REST adapter for Amazon Connect Service API — Queues. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/queues/{instanceid}
      name: queues-instanceid
      description: REST surface for queues-InstanceId.
      operations:
      - method: GET
        name: listqueues
        description: Amazon Connect List Queues
        call: amazon-connect-queues.listqueues
        with:
          InstanceId: rest.InstanceId
          queueTypes: rest.queueTypes
          nextToken: rest.nextToken
          maxResults: rest.maxResults
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createqueue
        description: Amazon Connect Create Queue
        call: amazon-connect-queues.createqueue
        with:
          InstanceId: rest.InstanceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queues/{instanceid}/{queueid}
      name: queues-instanceid-queueid
      description: REST surface for queues-InstanceId-QueueId.
      operations:
      - method: GET
        name: describequeue
        description: Amazon Connect Describe Queue
        call: amazon-connect-queues.describequeue
        with:
          InstanceId: rest.InstanceId
          QueueId: rest.QueueId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletequeue
        description: Amazon Connect Delete Queue
        call: amazon-connect-queues.deletequeue
        with:
          InstanceId: rest.InstanceId
          QueueId: rest.QueueId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-connect-queues-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Connect Service API — Queues. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-connect-list-queues
      description: Amazon Connect List Queues
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-connect-queues.listqueues
      with:
        InstanceId: tools.InstanceId
        queueTypes: tools.queueTypes
        nextToken: tools.nextToken
        maxResults: tools.maxResults
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-connect-create-queue
      description: Amazon Connect Create Queue
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-connect-queues.createqueue
      with:
        InstanceId: tools.InstanceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-connect-describe-queue
      description: Amazon Connect Describe Queue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-connect-queues.describequeue
      with:
        InstanceId: tools.InstanceId
        QueueId: tools.QueueId
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-connect-delete-queue
      description: Amazon Connect Delete Queue
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: amazon-connect-queues.deletequeue
      with:
        InstanceId: tools.InstanceId
        QueueId: tools.QueueId
      outputParameters:
      - type: object
        mapping: $.
