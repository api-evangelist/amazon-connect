naftiko: 1.0.0-alpha2
info:
  label: Amazon Connect Contact Center Operations
  description: Unified workflow capability for contact center operations combining instance management, agent management,
    queue management, contact handling, and real-time/historical metrics. Used by contact center administrators, supervisors,
    and operations teams to manage and monitor the Amazon Connect contact center platform.
  tags:
  - Amazon Connect
  - Contact Center
  - AWS
  - Operations
  - Metrics
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_SESSION_TOKEN: AWS_SESSION_TOKEN
capability:
  consumes:
  - type: http
    namespace: connect
    baseUri: https://connect.amazonaws.com
    description: Amazon Connect Service REST API
    authentication:
      type: bearer
      token: '{{AWS_SESSION_TOKEN}}'
    resources:
    - name: instances
      path: /instance
      description: Amazon Connect instance management
      operations:
      - name: list-instances
        method: GET
        description: List all Amazon Connect instances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-instance
        method: POST
        description: Create a new Amazon Connect instance
        body:
          type: json
          data:
            IdentityManagementType: '{{tools.identity_management_type}}'
            InstanceAlias: '{{tools.instance_alias}}'
            InboundCallsEnabled: '{{tools.inbound_calls_enabled}}'
            OutboundCallsEnabled: '{{tools.outbound_calls_enabled}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instance
      path: /instance/{InstanceId}
      description: Single Amazon Connect instance operations
      operations:
      - name: describe-instance
        method: GET
        description: Get details of a specific Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-instance
        method: DELETE
        description: Delete an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users/{InstanceId}
      description: Amazon Connect user management
      operations:
      - name: list-users
        method: GET
        description: List all users in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        - name: nextToken
          in: query
          type: string
          required: false
          description: Token for pagination
        - name: maxResults
          in: query
          type: integer
          required: false
          description: Maximum number of results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-user
        method: POST
        description: Create a user in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            Username: '{{tools.username}}'
            IdentityInfo: '{{tools.identity_info}}'
            PhoneConfig: '{{tools.phone_config}}'
            SecurityProfileIds: '{{tools.security_profile_ids}}'
            RoutingProfileId: '{{tools.routing_profile_id}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user
      path: /users/{InstanceId}/{UserId}
      description: Individual user operations
      operations:
      - name: describe-user
        method: GET
        description: Get details of a specific user
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        - name: UserId
          in: path
          type: string
          required: true
          description: The identifier of the user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-user
        method: DELETE
        description: Delete a user from an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        - name: UserId
          in: path
          type: string
          required: true
          description: The identifier of the user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: queues
      path: /queues/{InstanceId}
      description: Queue management
      operations:
      - name: list-queues
        method: GET
        description: List all queues in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-queue
        method: POST
        description: Create a new queue in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            Name: '{{tools.name}}'
            HoursOfOperationId: '{{tools.hours_of_operation_id}}'
            MaxContacts: '{{tools.max_contacts}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: routing-profiles
      path: /routing-profiles/{InstanceId}
      description: Routing profile management
      operations:
      - name: list-routing-profiles
        method: GET
        description: List all routing profiles in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-routing-profile
        method: POST
        description: Create a new routing profile
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            Name: '{{tools.name}}'
            Description: '{{tools.description}}'
            DefaultOutboundQueueId: '{{tools.default_outbound_queue_id}}'
            MediaConcurrencies: '{{tools.media_concurrencies}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contact-flows
      path: /contact-flows/{InstanceId}
      description: Contact flow management
      operations:
      - name: list-contact-flows
        method: GET
        description: List all contact flows in an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-contact-flow
        method: POST
        description: Create a new contact flow
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            Name: '{{tools.name}}'
            Type: '{{tools.type}}'
            Content: '{{tools.content}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contacts
      path: /contacts/{InstanceId}/{ContactId}
      description: Contact operations
      operations:
      - name: describe-contact
        method: GET
        description: Get details of a specific contact
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        - name: ContactId
          in: path
          type: string
          required: true
          description: The identifier of the contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search-contacts
      path: /search-contacts
      description: Contact search
      operations:
      - name: search-contacts
        method: POST
        description: Search contacts in an Amazon Connect instance
        body:
          type: json
          data:
            InstanceId: '{{tools.instance_id}}'
            TimeRange: '{{tools.time_range}}'
            MaxResults: '{{tools.max_results}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: current-metrics
      path: /metrics/current/{InstanceId}
      description: Real-time metrics
      operations:
      - name: get-current-metric-data
        method: POST
        description: Get real-time metric data from an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            Filters: '{{tools.filters}}'
            CurrentMetrics: '{{tools.current_metrics}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: historical-metrics
      path: /metrics/historical/{InstanceId}
      description: Historical metrics
      operations:
      - name: get-metric-data
        method: POST
        description: Get historical metric data from an Amazon Connect instance
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          required: true
          description: The identifier of the Amazon Connect instance
        body:
          type: json
          data:
            StartTime: '{{tools.start_time}}'
            EndTime: '{{tools.end_time}}'
            Filters: '{{tools.filters}}'
            HistoricalMetrics: '{{tools.historical_metrics}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: start-chat
      path: /contact/chat
      description: Start chat contacts
      operations:
      - name: start-chat-contact
        method: POST
        description: Start a chat contact with a customer
        body:
          type: json
          data:
            InstanceId: '{{tools.instance_id}}'
            ContactFlowId: '{{tools.contact_flow_id}}'
            ParticipantDetails: '{{tools.participant_details}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: start-voice
      path: /contact/outbound-voice
      description: Start outbound voice contacts
      operations:
      - name: start-outbound-voice-contact
        method: POST
        description: Place an outbound call to a contact
        body:
          type: json
          data:
            InstanceId: '{{tools.instance_id}}'
            ContactFlowId: '{{tools.contact_flow_id}}'
            DestinationPhoneNumber: '{{tools.destination_phone_number}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: contact-center-api
    description: Unified REST API for Amazon Connect contact center operations.
    resources:
    - path: /v1/instances
      name: instances
      description: Amazon Connect instance management
      operations:
      - method: GET
        name: list-instances
        description: List all Amazon Connect instances
        call: connect.list-instances
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-instance
        description: Create a new Amazon Connect instance
        call: connect.create-instance
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}
      name: instance
      description: Single instance operations
      operations:
      - method: GET
        name: describe-instance
        description: Get details of an Amazon Connect instance
        call: connect.describe-instance
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/agents
      name: agents
      description: Agent/user management
      operations:
      - method: GET
        name: list-agents
        description: List agents in an Amazon Connect instance
        call: connect.list-users
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-agent
        description: Create a new agent in an Amazon Connect instance
        call: connect.create-user
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/agents/{agent-id}
      name: agent
      description: Individual agent operations
      operations:
      - method: GET
        name: get-agent
        description: Get details of a specific agent
        call: connect.describe-user
        with:
          InstanceId: rest.instance-id
          UserId: rest.agent-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/queues
      name: queues
      description: Queue management
      operations:
      - method: GET
        name: list-queues
        description: List queues in an Amazon Connect instance
        call: connect.list-queues
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-queue
        description: Create a new queue in an Amazon Connect instance
        call: connect.create-queue
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/routing-profiles
      name: routing-profiles
      description: Routing profile management
      operations:
      - method: GET
        name: list-routing-profiles
        description: List routing profiles in an Amazon Connect instance
        call: connect.list-routing-profiles
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/contact-flows
      name: contact-flows
      description: Contact flow management
      operations:
      - method: GET
        name: list-contact-flows
        description: List contact flows in an Amazon Connect instance
        call: connect.list-contact-flows
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts/search
      name: contact-search
      description: Contact search
      operations:
      - method: POST
        name: search-contacts
        description: Search contacts in an Amazon Connect instance
        call: connect.search-contacts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/metrics/current
      name: current-metrics
      description: Real-time metrics
      operations:
      - method: POST
        name: get-current-metrics
        description: Get real-time metrics for queues and agents
        call: connect.get-current-metric-data
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instance-id}/metrics/historical
      name: historical-metrics
      description: Historical metrics
      operations:
      - method: POST
        name: get-historical-metrics
        description: Get historical metrics for an Amazon Connect instance
        call: connect.get-metric-data
        with:
          InstanceId: rest.instance-id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: contact-center-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Connect contact center management and monitoring.
    tools:
    - name: list-instances
      description: List all Amazon Connect contact center instances in the AWS account
      hints:
        readOnly: true
        openWorld: true
      call: connect.list-instances
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-instance
      description: Get details and status of a specific Amazon Connect instance
      hints:
        readOnly: true
        openWorld: true
      call: connect.describe-instance
      with:
        InstanceId: tools.instance_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-agents
      description: List all agents/users in an Amazon Connect instance
      hints:
        readOnly: true
        openWorld: true
      call: connect.list-users
      with:
        InstanceId: tools.instance_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-agent
      description: Get details of a specific agent including their routing profile and security profile
      hints:
        readOnly: true
        openWorld: true
      call: connect.describe-user
      with:
        InstanceId: tools.instance_id
        UserId: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-queues
      description: List all queues configured in an Amazon Connect instance
      hints:
        readOnly: true
        openWorld: true
      call: connect.list-queues
      with:
        InstanceId: tools.instance_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-routing-profiles
      description: List all routing profiles configured in an Amazon Connect instance
      hints:
        readOnly: true
        openWorld: true
      call: connect.list-routing-profiles
      with:
        InstanceId: tools.instance_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-contact-flows
      description: List all contact flows in an Amazon Connect instance
      hints:
        readOnly: true
        openWorld: true
      call: connect.list-contact-flows
      with:
        InstanceId: tools.instance_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-current-metrics
      description: Get real-time metrics showing agents online, contacts in queue, and queue health
      hints:
        readOnly: true
        openWorld: true
      call: connect.get-current-metric-data
      with:
        InstanceId: tools.instance_id
        Filters: tools.filters
        CurrentMetrics: tools.current_metrics
      outputParameters:
      - type: object
        mapping: $.
    - name: get-historical-metrics
      description: Get historical metrics for contacts handled, handle time, abandon rate, and service level
      hints:
        readOnly: true
        openWorld: true
      call: connect.get-metric-data
      with:
        InstanceId: tools.instance_id
        StartTime: tools.start_time
        EndTime: tools.end_time
        Filters: tools.filters
        HistoricalMetrics: tools.historical_metrics
      outputParameters:
      - type: object
        mapping: $.
    - name: search-contacts
      description: Search for past contacts by time range, agent, queue, or channel
      hints:
        readOnly: true
        openWorld: true
      call: connect.search-contacts
      with:
        InstanceId: tools.instance_id
        TimeRange: tools.time_range
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-contact
      description: Get full details of a specific contact interaction
      hints:
        readOnly: true
        openWorld: true
      call: connect.describe-contact
      with:
        InstanceId: tools.instance_id
        ContactId: tools.contact_id
      outputParameters:
      - type: object
        mapping: $.
    - name: start-outbound-voice-contact
      description: Place an outbound call from the contact center to a customer phone number
      hints:
        readOnly: false
        openWorld: false
      call: connect.start-outbound-voice-contact
      with:
        InstanceId: tools.instance_id
        ContactFlowId: tools.contact_flow_id
        DestinationPhoneNumber: tools.destination_phone_number
      outputParameters:
      - type: object
        mapping: $.
    - name: start-chat-contact
      description: Initiate a chat contact session with a customer
      hints:
        readOnly: false
        openWorld: false
      call: connect.start-chat-contact
      with:
        InstanceId: tools.instance_id
        ContactFlowId: tools.contact_flow_id
        ParticipantDetails: tools.participant_details
      outputParameters:
      - type: object
        mapping: $.
