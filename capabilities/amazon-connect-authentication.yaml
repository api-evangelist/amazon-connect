naftiko: 1.0.0-alpha2
info:
  label: Amazon Connect Service API — Authentication
  description: 'Amazon Connect Service API — Authentication. 1 operations. Lead operation: Amazon Connect Get Federation Token.
    Self-contained Naftiko capability covering one Amazon Connect business surface.'
  tags:
  - Amazon Connect
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_CONNECT_API_KEY: AMAZON_CONNECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-connect-authentication
    baseUri: https://connect.amazonaws.com
    description: Amazon Connect Service API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: federation-token-InstanceId
      path: /federation-token/{InstanceId}
      operations:
      - name: getfederationtoken
        method: GET
        description: Amazon Connect Get Federation Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: InstanceId
          in: path
          type: string
          description: The identifier of the Amazon Connect instance.
          required: true
    authentication:
      type: bearer
      token: '{{env.AMAZON_CONNECT_API_KEY}}'
  exposes:
  - type: rest
    namespace: amazon-connect-authentication-rest
    port: 8080
    description: REST adapter for Amazon Connect Service API — Authentication. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/federation-token/{instanceid}
      name: federation-token-instanceid
      description: REST surface for federation-token-InstanceId.
      operations:
      - method: GET
        name: getfederationtoken
        description: Amazon Connect Get Federation Token
        call: amazon-connect-authentication.getfederationtoken
        with:
          InstanceId: rest.InstanceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-connect-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Connect Service API — Authentication. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amazon-connect-get-federation-token
      description: Amazon Connect Get Federation Token
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-connect-authentication.getfederationtoken
      with:
        InstanceId: tools.InstanceId
      outputParameters:
      - type: object
        mapping: $.
