# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # Instance / Contact Center
  getInstance(instanceId: String!): Instance
  listInstances(maxResults: Int, nextToken: String): [Instance!]!
  getContactCenter(instanceId: String!): ContactCenter

  # Queues
  getQueue(instanceId: String!, queueId: String!): Queue
  listQueues(instanceId: String!, queueTypes: [QueueType!], maxResults: Int, nextToken: String): [Queue!]!
  searchQueues(instanceId: String!, searchFilter: AWSJSON, searchCriteria: AWSJSON, maxResults: Int, nextToken: String): [Queue!]!

  # Routing Profiles
  getRoutingProfile(instanceId: String!, routingProfileId: String!): RoutingProfile
  listRoutingProfiles(instanceId: String!, maxResults: Int, nextToken: String): [RoutingProfile!]!
  listRoutingProfileQueues(instanceId: String!, routingProfileId: String!, maxResults: Int, nextToken: String): [RoutingProfileQueue!]!

  # Contact Flows
  getContactFlow(instanceId: String!, contactFlowId: String!): ContactFlow
  listContactFlows(instanceId: String!, contactFlowTypes: [ContactFlowType!], maxResults: Int, nextToken: String): [ContactFlowSummary!]!
  getContactFlowModule(instanceId: String!, contactFlowModuleId: String!): ContactFlowModule
  listContactFlowModules(instanceId: String!, maxResults: Int, nextToken: String): [ContactFlowModule!]!

  # Contacts
  getContact(instanceId: String!, contactId: String!): Contact
  searchContacts(instanceId: String!, timeRange: TimeRange!, searchCriteria: AWSJSON, maxResults: Int, nextToken: String, sort: AWSJSON): [Contact!]!
  getContactAttributes(instanceId: String!, contactId: String!): [ContactAttribute!]!
  getChatTranscript(instanceId: String!, contactId: String!, participantId: String!, clientToken: String, maxResults: Int, nextToken: String, scanDirection: String, sortOrder: String, startPosition: AWSJSON): ChatTranscript

  # Agents / Users
  getUser(instanceId: String!, userId: String!): Agent
  listUsers(instanceId: String!, maxResults: Int, nextToken: String): [AgentSummary!]!
  searchUsers(instanceId: String!, searchFilter: AWSJSON, searchCriteria: AWSJSON, maxResults: Int, nextToken: String): [Agent!]!
  getUserData(instanceId: String!, userId: String!): UserData
  getCurrentUserData(instanceId: String!, filters: AWSJSON, maxResults: Int, nextToken: String): [CurrentUserData!]!

  # Agent Status
  getAgentStatus(instanceId: String!, agentStatusId: String!): AgentStatus
  listAgentStatuses(instanceId: String!, maxResults: Int, nextToken: String, agentStatusTypes: [AgentStatusType!]): [AgentStatus!]!

  # Hierarchy
  getUserHierarchyGroup(instanceId: String!, hierarchyGroupId: String!): HierarchyGroup
  listUserHierarchyGroups(instanceId: String!, maxResults: Int, nextToken: String): [HierarchyGroup!]!
  getUserHierarchyStructure(instanceId: String!): [HierarchyLevel!]!

  # Security Profiles
  getSecurityProfile(instanceId: String!, securityProfileId: String!): SecurityProfile
  listSecurityProfiles(instanceId: String!, maxResults: Int, nextToken: String): [SecurityProfile!]!

  # Phone Numbers
  getPhoneNumber(phoneNumberId: String!): PhoneNumber
  listPhoneNumbers(instanceId: String!, phoneNumberTypes: [PhoneNumberType!], phoneNumberCountryCodes: [String!], maxResults: Int, nextToken: String): [PhoneNumber!]!
  searchAvailablePhoneNumbers(targetArn: AWSARN!, phoneNumberCountryCode: String!, phoneNumberType: PhoneNumberType!, phoneNumberPrefix: String, maxResults: Int, nextToken: String): [PhoneNumber!]!

  # Hours of Operation
  getHoursOfOperation(instanceId: String!, hoursOfOperationId: String!): HoursOfOperation
  listHoursOfOperations(instanceId: String!, maxResults: Int, nextToken: String): [HoursOfOperation!]!

  # Metrics
  getCurrentMetricData(instanceId: String!, filters: AWSJSON!, currentMetrics: [RealTimeMetric!]!, groupings: [String!], maxResults: Int, nextToken: String): [MetricResult!]!
  getMetricDataV2(resourceArn: AWSARN!, startTime: AWSDateTime!, endTime: AWSDateTime!, interval: MetricInterval, filters: [AWSJSON!]!, groupings: [String!], metrics: [MetricV2!]!, maxResults: Int, nextToken: String): [MetricResult!]!

  # Prompts
  getPrompt(instanceId: String!, promptId: String!): PromptConfig
  listPrompts(instanceId: String!, maxResults: Int, nextToken: String): [PromptConfig!]!

  # Storage
  getInstanceStorageConfig(instanceId: String!, associationId: String!, resourceType: ResourceType!): StorageConfig
  listInstanceStorageConfigs(instanceId: String!, resourceType: ResourceType!, maxResults: Int, nextToken: String): [StorageConfig!]!

  # Integrations
  getIntegrationAssociation(instanceId: String!, integrationAssociationId: String!): IntegrationAssociation
  listIntegrationAssociations(instanceId: String!, integrationType: String, maxResults: Int, nextToken: String): [IntegrationAssociation!]!
  listLambdaFunctions(instanceId: String!, maxResults: Int, nextToken: String): [Lambda!]!
  listLexBots(instanceId: String!, maxResults: Int, nextToken: String): [LexBot!]!
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # Instance
  createInstance(clientToken: String, identityManagementType: String!, instanceAlias: String, directoryId: String, inboundCallsEnabled: Boolean!, outboundCallsEnabled: Boolean!, tags: [TagInput!]): Instance
  deleteInstance(instanceId: String!): Boolean
  updateInstanceAttribute(instanceId: String!, attributeType: String!, value: String!): Boolean

  # Queue
  createQueue(instanceId: String!, name: String!, description: String, outboundCallerConfig: OutboundCallerConfigInput, hoursOfOperationId: String!, maxContacts: Int, quickConnectIds: [String!], tags: [TagInput!], queueType: QueueType): Queue
  updateQueueName(instanceId: String!, queueId: String!, name: String, description: String): Boolean
  updateQueueStatus(instanceId: String!, queueId: String!, status: QueueStatus!): Boolean
  updateQueueHoursOfOperation(instanceId: String!, queueId: String!, hoursOfOperationId: String!): Boolean
  updateQueueMaxContacts(instanceId: String!, queueId: String!, maxContacts: Int!): Boolean
  deleteQueue(instanceId: String!, queueId: String!): Boolean
  associateQueueQuickConnects(instanceId: String!, queueId: String!, quickConnectIds: [String!]!): Boolean
  disassociateQueueQuickConnects(instanceId: String!, queueId: String!, quickConnectIds: [String!]!): Boolean

  # Routing Profile
  createRoutingProfile(instanceId: String!, name: String!, description: String!, defaultOutboundQueueId: String!, queueConfigs: [RoutingProfileQueueConfigInput!], mediaConcurrencies: [MediaConcurrencyInput!]!, tags: [TagInput!]): RoutingProfile
  updateRoutingProfileName(instanceId: String!, routingProfileId: String!, name: String, description: String): Boolean
  updateRoutingProfileDefaultOutboundQueue(instanceId: String!, routingProfileId: String!, defaultOutboundQueueId: String!): Boolean
  updateRoutingProfileConcurrency(instanceId: String!, routingProfileId: String!, mediaConcurrencies: [MediaConcurrencyInput!]!): Boolean
  associateRoutingProfileQueues(instanceId: String!, routingProfileId: String!, queueConfigs: [RoutingProfileQueueConfigInput!]!): Boolean
  disassociateRoutingProfileQueues(instanceId: String!, routingProfileId: String!, queueReferences: [QueueReferenceInput!]!): Boolean
  deleteRoutingProfile(instanceId: String!, routingProfileId: String!): Boolean

  # Contact Flow
  createContactFlow(instanceId: String!, name: String!, type: ContactFlowType!, description: String, content: String!, tags: [TagInput!]): ContactFlow
  updateContactFlowContent(instanceId: String!, contactFlowId: String!, content: String!): Boolean
  updateContactFlowName(instanceId: String!, contactFlowId: String!, name: String, description: String): Boolean
  updateContactFlowMetadata(instanceId: String!, contactFlowId: String!, name: String, description: String, contactFlowState: ContactFlowStatus): Boolean
  publishContactFlow(instanceId: String!, contactFlowId: String!, description: String): ContactFlow
  deleteContactFlow(instanceId: String!, contactFlowId: String!): Boolean
  importContactFlow(instanceId: String!, contactFlowId: String, content: String!): ContactFlow

  # Contact
  startOutboundVoiceContact(destinationPhoneNumber: String!, contactFlowId: String!, instanceId: String!, clientToken: String, sourcePhoneNumber: String, queueId: String, attributes: AWSJSON, trafficDistributionGroupId: String, answerMachineDetectionConfig: AWSJSON, campaignId: String, trafficType: String): Contact
  startChatContact(instanceId: String!, contactFlowId: String!, attributes: AWSJSON, participantDetails: ParticipantDetailsInput!, initialMessage: ChatMessageInput, clientToken: String, chatDurationInMinutes: Int, supportedMessagingContentTypes: [String!], persistentChat: PersistentChatInput, relatedContactId: String): Chat
  startTaskContact(instanceId: String!, previousContactId: String, contactFlowId: String, attributes: AWSJSON, name: String!, references: AWSJSON, description: String, clientToken: String, scheduledTime: AWSDateTime, taskTemplateId: String, relatedContactId: String, quickConnectId: String): Task
  stopContact(contactId: String!, instanceId: String!, disconnectReason: AWSJSON): Boolean
  suspendContact(contactId: String!, instanceId: String!): Boolean
  resumeContact(contactId: String!, instanceId: String!, contactFlowId: String): Boolean
  updateContactAttributes(instanceId: String!, initialContactId: String!, attributes: AWSJSON!): Boolean
  updateContactSchedule(instanceId: String!, contactId: String!, scheduledTime: AWSDateTime!): Boolean
  transferContact(instanceId: String!, contactId: String!, queueId: String, userId: String, contactFlowId: String!, clientToken: String): Contact
  tagContact(instanceId: String!, contactId: String!, tags: AWSJSON!): Boolean
  untagContact(instanceId: String!, contactId: String!, tagKeys: [String!]!): Boolean

  # Agent / User
  createUser(instanceId: String!, username: String!, password: String, identityInfo: UserIdentityInfoInput, phoneConfig: UserPhoneConfigInput!, directoryUserId: String, securityProfileIds: [String!]!, routingProfileId: String!, hierarchyGroupId: String, tags: [TagInput!]): Agent
  updateUserIdentityInfo(instanceId: String!, userId: String!, identityInfo: UserIdentityInfoInput!): Boolean
  updateUserPhoneConfig(instanceId: String!, userId: String!, phoneConfig: UserPhoneConfigInput!): Boolean
  updateUserRoutingProfile(instanceId: String!, userId: String!, routingProfileId: String!): Boolean
  updateUserSecurityProfiles(instanceId: String!, userId: String!, securityProfileIds: [String!]!): Boolean
  updateUserHierarchy(instanceId: String!, userId: String!, hierarchyGroupId: String): Boolean
  deleteUser(instanceId: String!, userId: String!): Boolean
  updateUserProficiencies(instanceId: String!, userId: String!, userProficiencies: AWSJSON!): Boolean

  # Agent Status
  createAgentStatus(instanceId: String!, name: String!, description: String, state: String!, displayOrder: Int, tags: [TagInput!]): AgentStatus
  updateAgentStatus(instanceId: String!, agentStatusId: String!, name: String, description: String, state: String, displayOrder: Int, resetOrderNumber: Boolean): Boolean

  # Hours of Operation
  createHoursOfOperation(instanceId: String!, name: String!, description: String, timeZone: String!, config: [HoursOfOperationDayInput!]!, tags: [TagInput!]): HoursOfOperation
  updateHoursOfOperation(instanceId: String!, hoursOfOperationId: String!, name: String, description: String, timeZone: String, config: [HoursOfOperationDayInput!]): Boolean
  deleteHoursOfOperation(instanceId: String!, hoursOfOperationId: String!): Boolean

  # Phone Numbers
  claimPhoneNumber(targetArn: AWSARN!, phoneNumber: AWSPhone!, phoneNumberDescription: String, tags: [TagInput!], clientToken: String): PhoneNumber
  releasePhoneNumber(phoneNumberId: String!, clientToken: String): Boolean
  updatePhoneNumber(phoneNumberId: String!, targetArn: AWSARN, instanceId: String, clientToken: String): PhoneNumber

  # Storage
  associateInstanceStorageConfig(instanceId: String!, resourceType: ResourceType!, storageConfig: StorageConfigInput!): StorageConfig
  updateInstanceStorageConfig(instanceId: String!, associationId: String!, resourceType: ResourceType!, storageConfig: StorageConfigInput!): Boolean
  disassociateInstanceStorageConfig(instanceId: String!, associationId: String!, resourceType: ResourceType!): Boolean

  # Prompts
  createPrompt(instanceId: String!, name: String!, description: String, s3Uri: String!, tags: [TagInput!]): PromptConfig
  updatePrompt(instanceId: String!, promptId: String!, name: String, description: String, s3Uri: String): Boolean
  deletePrompt(instanceId: String!, promptId: String!): Boolean

  # Integrations
  createIntegrationAssociation(instanceId: String!, integrationType: String!, integrationArn: AWSARN!, sourceApplicationUrl: String, sourceApplicationName: String, sourceType: String, tags: [TagInput!]): IntegrationAssociation
  deleteIntegrationAssociation(instanceId: String!, integrationAssociationId: String!): Boolean
  associateLambdaFunction(instanceId: String!, functionArn: AWSARN!): Boolean
  disassociateLambdaFunction(instanceId: String!, functionArn: AWSARN!): Boolean
  associateLexBot(instanceId: String!, lexBot: LexBotInput!): Boolean
  disassociateLexBot(instanceId: String!, lexBot: LexBotInput!): Boolean

  # Security Profiles
  createSecurityProfile(instanceId: String!, securityProfileName: String!, description: String, permissions: [String!], tags: [TagInput!], allowedAccessControlTags: [TagInput!], tagRestrictedResources: [String!], hierarchyRestrictedResources: [String!], allowedAccessControlHierarchyGroupId: String): SecurityProfile
  updateSecurityProfile(instanceId: String!, securityProfileId: String!, description: String, permissions: [String!], allowedAccessControlTags: [TagInput!], tagRestrictedResources: [String!], hierarchyRestrictedResources: [String!], allowedAccessControlHierarchyGroupId: String): Boolean
  deleteSecurityProfile(instanceId: String!, securityProfileId: String!): Boolean

  # Tags
  tagResource(resourceArn: AWSARN!, tags: AWSJSON!): Boolean
  untagResource(resourceArn: AWSARN!, tagKeys: [String!]!): Boolean
}

# ─── Input Types ──────────────────────────────────────────────────────────────

input TagInput {
  key: String!
  value: String!
}

input OutboundCallerConfigInput {
  outboundCallerIdName: String
  outboundCallerIdNumberId: String
  outboundFlowId: String
}

input RoutingProfileQueueConfigInput {
  queueReference: QueueReferenceInput!
  priority: Int!
  delay: Int!
}

input QueueReferenceInput {
  queueId: String!
  channel: Channel!
}

input MediaConcurrencyInput {
  channel: Channel!
  concurrency: Int!
}

input ParticipantDetailsInput {
  displayName: String!
}

input ChatMessageInput {
  contentType: String!
  content: String!
}

input PersistentChatInput {
  rehydrationType: String!
  sourceContactId: String
}

input UserIdentityInfoInput {
  firstName: String
  lastName: String
  email: String
  secondaryEmail: String
  mobile: String
}

input UserPhoneConfigInput {
  phoneType: String!
  autoAccept: Boolean
  afterContactWorkTimeLimit: Int
  deskPhoneNumber: String
}

input HoursOfOperationDayInput {
  day: String!
  startTime: HoursOfOperationTimeSliceInput!
  endTime: HoursOfOperationTimeSliceInput!
}

input HoursOfOperationTimeSliceInput {
  hours: Int!
  minutes: Int!
}

input StorageConfigInput {
  storageType: StorageType!
  s3Config: StorageLocationInput
  kinesisVideoStreamConfig: KinesisVideoStreamConfigInput
  kinesisStreamConfig: KinesisStreamConfigInput
  kinesisFirehoseConfig: KinesisFirehoseConfigInput
}

input StorageLocationInput {
  bucketName: String!
  bucketPrefix: String
  encryptionConfig: EncryptionConfigInput
}

input EncryptionConfigInput {
  encryptionType: String!
  keyId: String!
}

input KinesisVideoStreamConfigInput {
  prefix: String!
  retentionPeriodHours: Int!
  encryptionConfig: EncryptionConfigInput!
}

input KinesisStreamConfigInput {
  streamArn: AWSARN!
}

input KinesisFirehoseConfigInput {
  firehoseArn: AWSARN!
}

input LexBotInput {
  name: String!
  lexRegion: String!
}

# ─── Subscriptions ────────────────────────────────────────────────────────────

type Subscription {
  onContactStateChanged(instanceId: String!, contactId: String): Contact
  onAgentStatusChanged(instanceId: String!, agentId: String): UserData
  onQueueMetricUpdated(instanceId: String!, queueId: String): QueueMetric
}
