"""
Amazon Connect GraphQL Schema
Cloud-based contact center service providing omnichannel routing,
AI-powered agent assistance, and real-time/historical analytics.
Source: https://docs.aws.amazon.com/connect/latest/APIReference/
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────
scalar AWSDateTime
scalar AWSJSON
scalar AWSPhone
scalar AWSARN

# ─── Enums ────────────────────────────────────────────────────────────────────

enum InstanceStatus {
  CREATION_IN_PROGRESS
  ACTIVE
  CREATION_FAILED
}

enum QueueType {
  STANDARD
  AGENT
}

enum QueueStatus {
  ENABLED
  DISABLED
}

enum ContactFlowType {
  CONTACT_FLOW
  CUSTOMER_QUEUE
  CUSTOMER_HOLD
  CUSTOMER_WHISPER
  AGENT_HOLD
  AGENT_WHISPER
  OUTBOUND_WHISPER
  AGENT_TRANSFER
  QUEUE_TRANSFER
}

enum ContactFlowStatus {
  PUBLISHED
  SAVED
}

enum ContactState {
  INCOMING
  PENDING
  CONNECTING
  CONNECTED
  CONNECTED_ONHOLD
  MISSED
  ERROR
  ENDED
  REJECTED
}

enum ContactInitiationMethod {
  INBOUND
  OUTBOUND
  TRANSFER
  QUEUE_TRANSFER
  CALLBACK
  API
  DISCONNECT
  MONITOR
  EXTERNAL_OUTBOUND
  WEBRTC_API
  AGENT_REPLY
  FLOW
}

enum Channel {
  VOICE
  CHAT
  TASK
  EMAIL
}

enum PhoneNumberType {
  TOLL_FREE
  DID
  UIFN
  SHARED
  THIRD_PARTY_TF
  THIRD_PARTY_DID
  SHORT_CODE
}

enum PhoneNumberStatus {
  CLAIMED
  IN_PROGRESS
  FAILED
}

enum AgentStatusType {
  ROUTABLE
  CUSTOM
  OFFLINE
}

enum HierarchyLevelName {
  LEVEL_1
  LEVEL_2
  LEVEL_3
  LEVEL_4
  LEVEL_5
}

enum StorageType {
  S3
  KINESIS_VIDEO_STREAM
  KINESIS_STREAM
  KINESIS_FIREHOSE
}

enum ResourceType {
  CONTACT
  CONTACT_FLOW
  INSTANCE
  PARTICIPANT
  HIERARCHY_LEVEL
  HIERARCHY_GROUP
  USER
  USER_PROFICIENCIES
  ROUTING_PROFILE
  ROUTING_PROFILE_QUEUES
  AGENT_STATUS
  FLOW_ASSOCIATION
}

enum TrafficDistributionGroupStatus {
  CREATION_IN_PROGRESS
  ACTIVE
  CREATION_FAILED
  PENDING_DELETION
  DELETION_FAILED
  UPDATE_IN_PROGRESS
}

